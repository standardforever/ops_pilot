name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.12.15"

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv with dependency caching
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen --group dev

      - name: Run the local verification gate
        run: make verify

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "### Test coverage"
            echo '```text'
            uv run coverage report || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  container:
    name: Container build and smoke test
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start the service
        run: docker compose up --build --detach --wait --wait-timeout 90

      - name: Verify runtime user and image contents
        run: |
          test "$(docker compose exec -T ops-pilot id -u)" = "10001"
          docker compose exec -T ops-pilot test ! -e /app/.git
          docker compose exec -T ops-pilot test ! -e /app/src

      - name: Run the HTTP smoke test
        run: make smoke

      - name: Publish container logs
        if: always()
        run: docker compose logs --no-color >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

      - name: Stop the service
        if: always()
        run: docker compose down --remove-orphans --volumes

